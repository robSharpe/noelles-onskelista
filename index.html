<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noelles önskelista 🎁</title><style>body{margin:0;background:#fff5f8;color:#49313e;font:16px system-ui}main{max-width:820px;margin:auto;padding:24px}h1{text-align:center;font-size:2.4rem}.intro{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:28px 0}.card{background:white;border-radius:20px;padding:20px;box-shadow:0 3px 18px #d8a8b430}.emoji{font-size:36px}.card h2{font-size:19px}.reserved{background:#f5eef0}button{background:#ae527b;color:white;border:0;border-radius:12px;padding:12px 17px;cursor:pointer;font-weight:600}button:disabled{opacity:.5}.secondary{background:#765f70}input{padding:12px;border:1px solid #d4b9c6;border-radius:9px;max-width:90%}.hidden{display:none}dialog{border:0;border-radius:18px;padding:24px;max-width:85vw}#notice{min-height:24px;text-align:center}footer{text-align:center;color:#806977;font-size:13px}</style></head><body><main><h1>🎀 Noelles önskelista</h1><p class="intro">Välj en present och reservera den så att ingen annan köper samma sak 💕</p><p id="notice"></p><div style="text-align:center"><button id="refresh" class="secondary">↻ Uppdatera</button></div><section id="list" class="grid"></section><section><button id="adminToggle" class="secondary">Föräldraläge</button><div id="adminPanel" class="hidden"><div id="login"><p>Logga in som förälder</p><input id="email" type="email" placeholder="E-post"><input id="password" type="password" placeholder="Lösenord"><button id="signIn">Logga in</button></div><div id="adminTools" class="hidden"><p>Lägg till önskning</p><input id="newEmoji" placeholder="Emoji 🎁" size="5"><input id="newName" placeholder="Ny önskning"><button id="addWish">Lägg till</button><button id="signOut" class="secondary">Logga ut</button></div></div></section><footer><p>Med kärlek till Noelle 💗</p></footer></main><dialog id="reserveDialog"><form id="reserveForm"><h2 id="dialogTitle">Reservera present</h2><p>Ditt namn visas för andra som besöker önskelistan.</p><input id="buyer" required maxlength="60" placeholder="Ditt namn"><p><button type="submit">Jag köper den!</button> <button type="button" class="secondary" id="cancel">Avbryt</button></p></form></dialog><script type="module" src="./app.js"></script></body></html>
